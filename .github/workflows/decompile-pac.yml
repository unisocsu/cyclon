name: Extract and decompile PAC to C

on:
  push:
    paths:
      - "*.pac"
      - ".github/workflows/decompile-pac.yml"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip gzip wget file python3

      - name: Build PAC extractor
        run: gcc -O2 -Wall -Wextra -o tools/pacextractor tools/pacextractor.c

      - name: Find PAC
        id: pac
        shell: bash
        run: |
          set -euo pipefail
          pac="$(find . -maxdepth 1 -type f -iname '*.pac' | head -n 1)"
          test -n "$pac"
          echo "path=$pac" >> "$GITHUB_OUTPUT"
          echo "Using PAC: $pac"

      - name: Extract PAC partitions
        run: |
          set -euo pipefail
          rm -rf original decompiled
          mkdir -p original decompiled
          ./tools/pacextractor "${{ steps.pac.outputs.path }}"
          find . -maxdepth 1 -type f -name '*.bin' -print0 |
            while IFS= read -r -d '' f; do mv "$f" original/; done
          ls -lh original

      - name: Install latest Ghidra
        shell: bash
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest")); print(d["assets"][0]["browser_download_url"])')"
          wget -q --show-progress "$url" -O /tmp/ghidra.zip
          mkdir -p /opt/ghidra
          unzip -q /tmp/ghidra.zip -d /opt/ghidra
          GHIDRA_DIR="$(find /opt/ghidra -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Copy existing decompiled C source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f x30-user-decompiled.zip ]; then
            mkdir -p decompiled/user-source
            unzip -o x30-user-decompiled.zip -d decompiled/user-source
            if [ -f decompiled/user-source/user_bin.c.gz ]; then
              gzip -dc decompiled/user-source/user_bin.c.gz > decompiled/user-source/user_bin.c
            fi
          fi

      - name: Decompile BIN files to C
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decompiled/bin-c ghidra-input
          for f in original/*.bin; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .bin)"
            project="/tmp/ghidra-$base"
            rm -rf "$project"
            mkdir -p "$project"
            "$GHIDRA_DIR/support/analyzeHeadless"               "$project" "$base"               -import "$PWD/$f"               -loader BinaryLoader               -processor "ARM:LE:32:v7"               -analysisTimeoutPerFile 0               -scriptPath "$PWD/tools"               -postScript ExportDecompiledC.java               "$PWD/decompiled/bin-c/$base.c"               -deleteProject               || { echo "Ghidra failed for $base" > "decompiled/bin-c/$base.error.txt"; continue; }
          done

      - name: Create C report
        run: |
          {
            echo "# C decompilation"
            echo
            echo "Generated from PAC BIN partitions using Ghidra."
            echo
            find decompiled -type f \( -name '*.c' -o -name '*.error.txt' \) -print | sort
          } > decompiled/README.md

      - name: Package C results
        uses: actions/upload-artifact@v4
        with:
          name: pac-c-decompilation
          path: |
            original/
            decompiled/
          if-no-files-found: error
          compression-level: 1
