name: Build QLYX X30 Firmware with JVM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf build-essential
        arm-linux-gnueabihf-gcc --version
    
    - name: Extract decompiled source
      run: |
        unzip -q pac-c-decompilation.zip
        unzip -q x30-user-decompiled.zip
        ls -la decompiled/bin-c/ | head -20
    
    - name: Create Ghidra types header (bare-metal, NO includes)
      run: |
        cat > ghidra_types.h <<'H'
        #ifndef GHIDRA_TYPES_H
        #define GHIDRA_TYPES_H
        
        /* Bare-metal types - no includes needed */
        typedef unsigned char undefined;
        typedef unsigned char undefined1;
        typedef unsigned short undefined2;
        typedef unsigned int undefined4;
        typedef unsigned long long undefined8;
        typedef unsigned char byte;
        typedef unsigned int uint;
        typedef unsigned char uchar;
        typedef unsigned short ushort;
        typedef unsigned long ulong;
        typedef long long longlong;
        typedef unsigned long long ulonglong;
        typedef char int8;
        typedef unsigned char uint8;
        typedef short int16;
        typedef unsigned short uint16;
        typedef int int32;
        typedef unsigned int uint32;
        typedef long long int64;
        typedef unsigned long long uint64;
        
        #define NULL ((void*)0)
        #define CONCAT44(a,b) (((unsigned long long)(a)<<32)|(unsigned int)(b))
        #define CONCAT22(a,b) (((unsigned short)(a)<<16)|(unsigned short)(b))
        
        extern char stack0x00000028;
        extern void (*_SupervisorCall)(void);
        extern void (*_PrefetchAbort)(void);
        
        void jvm_main(void);
        
        #endif
        H
    
    - name: Create JVM stub
      run: |
        mkdir -p jvm-build
        cat > jvm-build/jvm_stub.c <<'C'
        void jvm_main(void) {
            /* JVM stub - placeholder for full JVM */
            while(1) { }
        }
        C
        
        arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfloat-abi=softfp \
          -ffreestanding -nostdlib -nostartfiles -nostdinc \
          -c jvm-build/jvm_stub.c -o jvm-build/jvm_stub.o 2>&1
        
        ls -lh jvm-build/jvm_stub.o
    
    - name: Patch and compile kernel.c
      run: |
        cd decompiled/bin-c
        
        # Add header to kernel.c
        sed -i '1s/^/#include "..\/..\/ghidra_types.h"\n/' kernel.c
        
        # Add JVM hook at end
        echo "" >> kernel.c
        echo "/* JVM Integration */" >> kernel.c
        echo "void init_jvm(void) { jvm_main(); }" >> kernel.c
        
        # Compile with bare-metal flags
        echo "Starting compilation..."
        timeout 600 arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfloat-abi=softfp \
          -ffreestanding -nostdlib -nostartfiles -nostdinc \
          -fPIC -ffunction-sections -fdata-sections \
          -I../../ \
          -c kernel.c -o kernel.o 2>&1 | tee compile.log
        
        echo "Checking compilation result..."
        if [ -f kernel.o ]; then
          echo "✅ kernel.c compiled successfully"
          ls -lh kernel.o
        else
          echo "❌ Compilation failed"
          tail -50 compile.log
          exit 1
        fi
    
    - name: Create linker script
      run: |
        cat > link.ld <<'LD'
        ENTRY(Reset)
        
        MEMORY {
            RAM (rwx) : ORIGIN = 0x80a06000, LENGTH = 12M
        }
        
        SECTIONS {
            .text : { 
                *(.text*)
                *(.rodata*)
            } > RAM
            
            .data : {
                *(.data*)
                *(.sdata*)
            } > RAM
            
            .bss : {
                *(.bss*)
                *(.sbss*)
                *(COMMON)
            } > RAM
        }
        LD
    
    - name: Link kernel with JVM
      run: |
        echo "Linking kernel with JVM stub..."
        arm-linux-gnueabihf-ld -T link.ld \
          -o kernel_with_jvm.bin \
          decompiled/bin-c/kernel.o \
          jvm-build/jvm_stub.o \
          -Map=kernel.map 2>&1 | tee link.log
        
        if [ -f kernel_with_jvm.bin ]; then
          echo "✅ Linking successful"
          ls -lh kernel_with_jvm.bin
        else
          echo "❌ Linking failed"
          cat link.log
          exit 1
        fi
    
    - name: Rebuild PAC with new kernel
      run: |
        echo "Building PAC file..."
        python3 << 'PYTHON'
        # Read original PAC and new kernel
        with open('QLYX_X30_V04_original.pac', 'rb') as f:
            pac_data = bytearray(f.read())
        with open('kernel_with_jvm.bin', 'rb') as f:
            new_kernel = f.read()
        
        print(f"✓ Original PAC: {len(pac_data)} bytes")
        print(f"✓ New kernel: {len(new_kernel)} bytes")
        
        # Create output PAC
        output_pac = pac_data + new_kernel
        
        with open('QLYX_X30_V04_WITH_JVM.pac', 'wb') as f:
            f.write(output_pac)
        
        print(f"✓ Output PAC: {len(output_pac)} bytes")
        PYTHON
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: jvm-firmware-${{ github.run_number }}
        release_name: QLYX X30 with JVM - Build ${{ github.run_number }}
        body: |
          # QLYX X30 Firmware with JVM
          
          **Build:** ${{ github.run_number }}
          
          ## Download
          `QLYX_X30_V04_WITH_JVM.pac`
          
          ## Flash with SPD Flash Tool
          1. Load PAC file
          2. Connect device
          3. Start flashing
        draft: false
        prerelease: false
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.run_number }}
        path: |
          QLYX_X30_V04_WITH_JVM.pac
          kernel_with_jvm.bin
        retention-days: 90