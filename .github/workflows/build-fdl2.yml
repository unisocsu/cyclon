name: Build T117 FDL2 Hello
on:
  push:
    paths: ['.github/workflows/build-fdl2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make
      - name: Clone spreadtrum_flash
        run: git clone --depth 1 https://github.com/ilyakurdyukov/spreadtrum_flash
      - name: Inject Hello World LCD Text
        run: |
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('spreadtrum_flash/t117_fdl/main.c')
          t = p.read_text()
          code = r'''
          	// hellow world i qulyx cyclon x30 custom ram kernel - via t117_fdl (like fphelper_t117 payload)
          	// FDL2 runs with valid SP, so we can use stack and UART 0x70000000 + framebuffer 0x20800000
          	{
          		volatile unsigned *s = (volatile unsigned*)0x7000000c;
          		volatile char *u = (volatile char*)0x70000000;
          		volatile unsigned short *fb = (volatile unsigned short*)0x20800000;
          		// simple 5x7 font for "hellow world i qulyx cyclon x30 custom ram kernel"
          		// For brevity draw solid blocks per char: each char 8x16, white on black
          		int i, x, y;
          		for(i=0;i<128*160;i++) fb[i]=0x0000; // clear black
          		const char *msg="hellow world";
          		const char *msg2="i qulyx cyclon";
          		const char *msg3="x30 custom";
          		const char *msg4="ram kernel";
          		// draw 4 lines centered (8px per char)
          		const char *lines[4]={msg,msg2,msg3,msg4};
          		for(int l=0;l<4;l++){
          			const char *pm=lines[l];
          			int len=0; while(pm[len]) len++;
          			int sx=(128 - len*6)/2;
          			int sy=40 + l*20;
          			for(int ci=0;ci<len;ci++){
          				char c=pm[ci];
          				if(c==' ') continue;
          				// draw block 5x10 for each char
          				for(y=0;y<10;y++) for(x=0;x<5;x++) fb[(sy+y)*128 + sx + ci*6 + x]=0xFFFF;
          			}
          		}
          		// UART echo (visible in spd_dump --verbose or USB sniffer)
          		const char *um="hellow world i qulyx cyclon x30 custom ram kernel\r\n";
          		while(*um){ while((*s & 0xFF00)!=0){} *u=*um++; }
          	}
          '''
          t = t.replace('dl_status.start = ~0;\n\n#if FDL2', 'dl_status.start = ~0;' + code + '\n#if FDL2')
          p.write_text(t)
          print('injected hello world lcd ok')
          PY
      - name: Build FDL2
        run: |
          cd spreadtrum_flash/t117_fdl
          make TOOLCHAIN=/usr/bin/arm-none-eabi FDL=2
          ls -lh *.bin
          cp t117_fdl2.bin $GITHUB_WORKSPACE/t117_hello_fdl2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: t117-hello-fdl2
          path: t117_hello_fdl2.bin
