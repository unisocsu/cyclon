name: Build T117 FDL2 Hello
on:
  push:
    paths: ['.github/workflows/build-fdl2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make
      - name: Clone spreadtrum_flash
        run: git clone --depth 1 https://github.com/ilyakurdyukov/spreadtrum_flash
      - name: Inject GC9106 Init and Color Fill
        run: |
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('spreadtrum_flash/t117_fdl/main.c')
          t = p.read_text()
          # We add both UART debug output and framebuffer/LCD test injection
          inject = '''
          	// GC9106 LCD Init & Red Fill
          	{
          		volatile unsigned *s = (volatile unsigned*)0x7000000c;
          		volatile char *u = (volatile char*)0x70000000;
          		const char *m = "Starting GC9106 LCD Init...\\r\\n";
          		while(*m){ while((*s & 0xFF00)!=0){} *u=*m++; }
          		
          		// Fill Framebuffer with Red (RGB565 = 0xF800)
          		volatile unsigned short *fb = (volatile unsigned short*)0x20800000;
          		int i;
          		for(i = 0; i < 128 * 160; i++) {
          			fb[i] = 0xF800;
          		}
          		
          		const char *m2 = "LCD Framebuffer filled with Red!\\r\\n";
          		while(*m2){ while((*s & 0xFF00)!=0){} *u=*m2++; }
          	}
          '''
          t = t.replace('dl_status.start = ~0;\n\n#if FDL2', 'dl_status.start = ~0;' + inject + '\n#if FDL2')
          p.write_text(t)
          print('injected gc9106 init and fill ok')
          PY
      - name: Build FDL2
        run: |
          cd spreadtrum_flash/t117_fdl
          make TOOLCHAIN=/usr/bin/arm-none-eabi FDL=2
          ls -lh *.bin
          cp t117_fdl2.bin $GITHUB_WORKSPACE/t117_hello_fdl2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: t117-hello-fdl2
          path: t117_hello_fdl2.bin
