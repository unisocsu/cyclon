name: Build T117 FDL2 Hello
on:
  push:
    paths: ['.github/workflows/build-fdl2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make
      - name: Clone spreadtrum_flash
        run: git clone --depth 1 https://github.com/ilyakurdyukov/spreadtrum_flash
      - name: Inject Hello
        run: |
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('spreadtrum_flash/t117_fdl/main.c')
          t = p.read_text()
          inject = '\n\t// Hello\n\t{ volatile unsigned *s = (volatile unsigned*)0x7000000c; volatile char *u = (volatile char*)0x70000000; const char *m = "Hello from Custom FDL2!\\r\\n"; while(*m){ while((*s & 0xFF00)!=0){} *u=*m++; } }\n'
          t = t.replace('dl_status.start = ~0;\n\n#if FDL2', 'dl_status.start = ~0;' + inject + '\n#if FDL2')
          p.write_text(t)
          print('injected ok')
          PY
      - name: Build FDL2
        run: |
          cd spreadtrum_flash/t117_fdl
          make TOOLCHAIN=/usr/bin/arm-none-eabi FDL=2
          ls -lh *.bin
          cp t117_fdl2.bin $GITHUB_WORKSPACE/t117_hello_fdl2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: t117-hello-fdl2
          path: t117_hello_fdl2.bin
