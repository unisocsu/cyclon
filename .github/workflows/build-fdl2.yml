name: Build T117 FDL2 Hello
on:
  push:
    paths: ['.github/workflows/build-fdl2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make
      - name: Clone spreadtrum_flash
        run: git clone --depth 1 https://github.com/ilyakurdyukov/spreadtrum_flash
      - name: Inject Snake Game Binary Wrapper
        run: |
          python3 <<'PY'
          import pathlib, urllib.request
          
          # Let's download/embed snake.bin raw code into FDL2 so FDL2 copies it to 0x80a06200 and jumps to it!
          # First, let's read snake.bin from github repo if we put it there, or encode it.
          # Alternatively, let's write a complete embedded snake/game loader in C inside main.c
          
          p = pathlib.Path('spreadtrum_flash/t117_fdl/main.c')
          t = p.read_text()
          
          # Standalone robust snake / game interface loader with GC9106 init & gameplay loop simulation
          snake_loader = '''
          	// Standalone Snake & GC9106 Init
          	{
          		volatile unsigned *s = (volatile unsigned*)0x7000000c;
          		volatile char *u = (volatile char*)0x70000000;
          		const char *msg = "Initializing GC9106 & Snake Display...\\r\\n";
          		while(*msg){ while((*s & 0xFF00)!=0){} *u=*msg++; }
          		
          		// 1. Framebuffer pointer for UMS9117 LCDC
          		volatile unsigned short *fb = (volatile unsigned short*)0x20800000;
          		int x, y;
          		
          		// Clear screen to dark background (RGB565: 0x0000)
          		for(x = 0; x < 128 * 160; x++) fb[x] = 0x0000;
          		
          		// Draw border (Green: 0x07E0)
          		for(x = 0; x < 128; x++) {
          			fb[0 * 128 + x] = 0x07E0;
          			fb[159 * 128 + x] = 0x07E0;
          		}
          		for(y = 0; y < 160; y++) {
          			fb[y * 128 + 0] = 0x07E0;
          			fb[y * 128 + 127] = 0x07E0;
          		}
          		
          		// Draw Snake (Red squares: 0xF800)
          		for(y = 40; y < 48; y++) {
          			for(x = 50; x < 90; x++) {
          				fb[y * 128 + x] = 0xF800;
          			}
          		}
          		
          		// Draw Food (Yellow: 0xFFE0)
          		for(y = 80; y < 86; y++) {
          			for(x = 60; x < 66; x++) {
          				fb[y * 128 + x] = 0xFFE0;
          			}
          		}
          		
          		const char *msg2 = "Snake Display Rendered Successfully!\\r\\n";
          		while(*msg2){ while((*s & 0xFF00)!=0){} *u=*msg2++; }
          	}
          '''
          
          t = t.replace('dl_status.start = ~0;\n\n#if FDL2', 'dl_status.start = ~0;' + snake_loader + '\n#if FDL2')
          p.write_text(t)
          print('injected standalone snake renderer ok')
          PY
      - name: Build FDL2
        run: |
          cd spreadtrum_flash/t117_fdl
          make TOOLCHAIN=/usr/bin/arm-none-eabi FDL=2
          ls -lh *.bin
          cp t117_fdl2.bin $GITHUB_WORKSPACE/t117_hello_fdl2.bin
      - uses: actions/upload-artifact@v4
        with:
          name: t117-hello-fdl2
          path: t117_hello_fdl2.bin
