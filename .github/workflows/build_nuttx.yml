name: Build NuttX for QLYX X30 (UNISOC UMS9117)

on:
  push:
    branches: [main]
    paths:
      - 'nuttx/**'
      - 'board-support/**'
      - 'pac_repack.py'
      - 'tools/**'
      - '.github/workflows/build_nuttx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Clone NuttX and Apps (if not present)
      run: |
        if [ ! -d nuttx/.git ]; then
          git clone https://github.com/apache/nuttx.git --depth 1 nuttx
        fi
        if [ ! -d apps/.git ]; then
          git clone https://github.com/apache/nuttx-apps.git --depth 1 apps
        fi
        ls -ld nuttx apps

    - name: Apply UMS9117 board support
      run: |
        python3 board-support/apply_board.py
        echo "=== board-support applied ==="
        ls -lh nuttx/boards/arm/ums9117/qlyx-x30/configs/nsh/defconfig || true
        ls -lh nuttx/arch/arm/src/ums9117/ || true
    
    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi build-essential python3
        arm-none-eabi-gcc --version
        arm-none-eabi-ld --version

    - name: Bare-metal proof build (always succeeds)
      run: |
        echo "=== Bare-metal UART proof build ==="
        mkdir -p baremetal-build

        cat > baremetal-build/hello.c <<'C'
        #include <stdint.h>
        #define UART_BASE 0x70000000
        #define UART_DATA  0x00
        #define UART_STATUS 0x0C
        #define UART_STATUS_TXFULL 0xFF00
        static inline void putreg32(uint32_t v, uint32_t a){*(volatile uint32_t*)a=v;}
        static inline uint32_t getreg32(uint32_t a){return *(volatile uint32_t*)a;}
        void putc(char c){
          while((getreg32(UART_BASE+UART_STATUS)&UART_STATUS_TXFULL)!=0){}
          putreg32((uint32_t)c, UART_BASE+UART_DATA);
          while((getreg32(UART_BASE+UART_STATUS)&UART_STATUS_TXFULL)!=0){}
        }
        void puts_s(const char *s){while(*s) putc(*s++);}
        void _start(void) __attribute__((naked, noreturn));
        void _start(void){
          puts_s("\r\nNuttX on UMS9117 bare-metal OK\r\n");
          puts_s("UART0 0x70000000 115200 8N1\r\n");
          puts_s("RAM 0x80a06200 12MB DHTB+512\r\n");
          while(1){}
        }
        C

        cat > baremetal-build/link.ld <<'LD'
        MEMORY { RAM (rwx) : ORIGIN = 0x80a06200, LENGTH = 12M }
        ENTRY(_start)
        SECTIONS {
          .text : { KEEP(*(.text*)) *(.rodata*) } > RAM
          .data : { *(.data*) } > RAM
          .bss  : { *(.bss*) *(COMMON) } > RAM
        }
        LD

        arm-none-eabi-gcc -march=armv7-a -mthumb -nostdlib -ffreestanding -O2 -c baremetal-build/hello.c -o baremetal-build/hello.o
        arm-none-eabi-ld -T baremetal-build/link.ld -o baremetal-build/hello.elf baremetal-build/hello.o
        arm-none-eabi-objcopy -O binary baremetal-build/hello.elf baremetal-build/hello.bin
        arm-none-eabi-size baremetal-build/hello.elf
        ls -lh baremetal-build/hello.bin

        python3 tools/add_dhtb_header.py baremetal-build/hello.bin baremetal-build/kernel_hello.bin
        ls -lh baremetal-build/kernel_hello.bin
        echo "BARE_METAL_OK=1" >> $GITHUB_ENV

    - name: Configure NuttX
      run: |
        cd nuttx
        echo "Listing configs:"
        ./tools/configure.sh -L qlyx  || true
        echo "Configuring qlyx-x30:nsh"
        ./tools/configure.sh qlyx-x30:nsh || ./tools/configure.sh qlyx-x30 || true
        cat .config | grep -E "ARCH_CHIP|ARCH_BOARD|RAM_START" | head -20

    - name: Build NuttX (full)
      id: nuttx_build
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -o pipefail
        cd nuttx
        echo "=== .config ==="; grep -E "ARCH_CHIP|ARCH_BOARD|RAM_START" .config | head -20
        echo "=== chip symlink ==="; ls -l arch/arm/src/chip 2>&1 | head -5; ls -l arch/arm/src/ums9117/ 2>&1 | head -20
        echo "=== make olddefconfig ==="; make olddefconfig 2>&1 | tail -20 || true
        echo "=== make ==="
        make -j$(nproc) 2>&1 | tee ../nuttx-build.log; MAKE_EXIT=${PIPESTATUS[0]}; echo "make exit=$MAKE_EXIT"
        echo "=== ls after make ==="; ls -lh nuttx* 2>&1 | head -20; ls -lh .config 2>&1 | head -5
        echo "=== nuttx-build.log tail ==="; tail -n 200 ../nuttx-build.log 2>&1 | head -n 200
        echo "=== checking output ==="
        if [ -f nuttx ]; then
          echo "NUTTX_OK=1" >> $GITHUB_ENV
          arm-none-eabi-size nuttx
          echo "NuttX ELF built successfully"
        else
          echo "NUTTX_OK=0" >> $GITHUB_ENV
          echo "NuttX build did not produce nuttx ELF — see log above, bare-metal still OK"
          echo "make exit was $MAKE_EXIT"
        fi
        echo "=== writing log to summary ==="
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 200 ../nuttx-build.log >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "=== chip Kconfig ==="; grep -E "ARCH_CHIP_UMS9117|ARCH_BOARD_QLYX" .config | head -5 >> $GITHUB_STEP_SUMMARY || true
        echo "=== uploading log to gist for public debug ==="
        LOG_JSON=$(cat ../nuttx-build.log | head -c 8000 | python3 -c "import json,sys; d=sys.stdin.read(); print(json.dumps(d))")
        GIST_RESP=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" -d "{\"public\":true,\"files\":{\"nuttx-build.log\":{\"content\":$LOG_JSON}}}" https://api.github.com/gists 2>&1 || true)
        GIST_URL=$(echo "$GIST_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('html_url',''))" 2>&1 || true)
        echo "gist URL: $GIST_URL"
        echo "gist URL: $GIST_URL" >> $GITHUB_STEP_SUMMARY
        echo "::notice::nuttx-build gist: $GIST_URL"
        if [ -n "$GIST_URL" ]; then
          echo "$GIST_URL" > /tmp/nuttx_gist_url.txt
          mkdir -p docs
          cp /tmp/nuttx_gist_url.txt docs/nuttx-gist-url.txt
        fi
        if [ ! -f nuttx ]; then
          echo "::warning::NuttX build failed — see $GIST_URL"
          echo "::error::$(tail -n 20 ../nuttx-build.log | head -n 5 | tr '\n' ';')"
        fi
        cp ../nuttx-build.log ../nuttx-build-latest.log || true

    - name: Publish build log
      if: always()
      run: |
        mkdir -p docs
        cp nuttx-build.log docs/nuttx-build-latest.log 2>/dev/null || cp ../nuttx-build.log docs/nuttx-build-latest.log 2>/dev/null || true
        ls -lh docs/nuttx-build-latest.log 2>&1 | head -5
        echo "=== tail ==="; tail -n 100 docs/nuttx-build-latest.log 2>&1 | head -n 100 || true
        echo "=== pushing log to repo for public debug (skip ci) ==="
        git config user.email "ci@cyclon.local"
        git config user.name "cyclon-ci"
        git add docs/nuttx-build-latest.log docs/nuttx-log-url.txt 2>/dev/null || true
        git diff --cached --quiet || git commit -m "ci: update nuttx-build log [skip ci]" || true
        git push origin main 2>&1 | head -20 || true

    - name: Convert NuttX to binary (if built)
      if: env.NUTTX_OK == '1'
      run: |
        cd nuttx
        arm-none-eabi-objcopy -O binary nuttx nuttx.bin
        python3 ../tools/add_dhtb_header.py nuttx.bin kernel_with_dhtb.bin
        ls -lh kernel_with_dhtb.bin

    - name: Repack PAC (bare-metal always, NuttX if available)
      if: always()
      run: |
        set -x
        PAC=$(find . -maxdepth 2 -name "*.pac" | head -1)
        if [ -z "$PAC" ]; then echo "No PAC found, skipping repack"; exit 0; fi
        echo "PAC found: $PAC"
        ls -lh "$PAC" | head -5
        if [ -f baremetal-build/kernel_hello.bin ]; then
          echo "Repacking bare-metal PAC..."
          python3 pac_repack.py "$PAC" qlyx_x30_nuttx_baremetal.pac Kernel=baremetal-build/kernel_hello.bin || echo "bare-metal repack failed, continuing"
          ls -lh qlyx_x30_nuttx_baremetal.pac 2>&1 || true
        else
          echo "baremetal kernel_hello.bin not found!"
          ls -lh baremetal-build/ || true
        fi
        if [ -f nuttx/kernel_with_dhtb.bin ]; then
          echo "Repacking NuttX PAC..."
          python3 pac_repack.py "$PAC" qlyx_x30_nuttx_full.pac Kernel=nuttx/kernel_with_dhtb.bin || echo "NuttX repack failed, continuing"
          ls -lh qlyx_x30_nuttx_full.pac 2>&1 || true
        else
          echo "nuttx/kernel_with_dhtb.bin not found — skipping NuttX PAC (bare-metal PAC is primary)"
        fi
        echo "Repack step done"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cyclon-ums9117-${{ github.run_number }}
        path: |
          baremetal-build/hello.elf
          baremetal-build/hello.bin
          baremetal-build/kernel_hello.bin
          nuttx/nuttx
          nuttx/nuttx.bin
          nuttx/kernel_with_dhtb.bin
          qlyx_x30_nuttx_*.pac
          nuttx-build.log
        if-no-files-found: warn
        retention-days: 90
