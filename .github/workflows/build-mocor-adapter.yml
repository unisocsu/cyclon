name: Build MOCOR adapter

on:
  push:
    paths:
      - "mocor-adapter/**"
      - ".github/workflows/build-mocor-adapter.yml"
  pull_request:
    paths:
      - "mocor-adapter/**"
      - ".github/workflows/build-mocor-adapter.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S mocor-adapter -B build/mocor-adapter

      - name: Build
        run: cmake --build build/mocor-adapter --config Release

      - name: Test
        run: ctest --test-dir build/mocor-adapter --output-on-failure

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: mocor-adapter-test
          path: build/mocor-adapter/test_adapter
