name: Decompile Snake to C

on:
  workflow_dispatch:
  push:
    paths:
      - "prebuilt/usb_t117/snake.bin"
      - ".github/workflows/decompile-snake.yml"

permissions:
  contents: read

jobs:
  decompile-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip -O /tmp/ghidra.zip
          mkdir -p /opt/ghidra && unzip -q /tmp/ghidra.zip -d /opt/ghidra
          echo "GHIDRA_DIR=$(find /opt/ghidra -maxdepth 1 -type d -name 'ghidra_*' | head -n1)" >> $GITHUB_ENV
      - name: Decompile snake.bin
        run: |
          set -x
          mkdir -p decompiled/snake
          dd if=prebuilt/usb_t117/snake.bin of=/tmp/snake.payload bs=512 skip=1 status=none
          echo "payload $(stat -c%s /tmp/snake.payload) bytes"
          hexdump -C /tmp/snake.payload | head -5
          mkdir -p /tmp/ghidra-snake
          $GHIDRA_DIR/support/analyzeHeadless /tmp/ghidra-snake snake -import /tmp/snake.payload -loader BinaryLoader -processor "ARM:LE:32:v7" -analysisTimeoutPerFile 600 -scriptPath $PWD/tools -postScript ExportDecompiledC.java $PWD/decompiled/snake/snake.c -deleteProject || echo "ghidra exit $?"
          ls -R decompiled/snake/ || true
          cat decompiled/snake/snake.c 2>&1 | head -n 100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: snake-decompiled
          path: decompiled/snake/
